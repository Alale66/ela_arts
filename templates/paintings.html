{% extends "base.html" %}

{% block title %}Paintings – Ela Arts{% endblock %}

{% block content %}
<section class="portfolio-section">
    <div class="portfolio-container">
        <section class="portfolio-hero">
            <h2 class="portfolio-title">{{ categories.paintings[0].title }}</h2>
            <p class="portfolio-subtitle">
                {{ categories.paintings[0].description }}
            </p>
        </section>

        <div id="painting-collage" class="collage"></div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/collage.js"></script>
<script src="/static/painting-collage.js"></script>

<script>
let cachedImages = [];

loadAllMedia(paintingImages).then(images => {
    cachedImages = images;
    buildCollage(images, "painting-collage");
});

window.addEventListener("resize", () => {
    if (cachedImages.length > 0) {
        buildCollage(cachedImages, "painting-collage");
    }
});
</script>
{% endblock %}
